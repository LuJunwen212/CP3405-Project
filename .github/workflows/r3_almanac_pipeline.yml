name: R3 Almanac Agent Multi-Week Automation Pipeline

on:
  # push:
  #   branches:
  #     - week-9
  schedule:
    - cron: '13 20 * * 5'
  workflow_dispatch:
    inputs:
      custom_market_week:
        description: 'Target MARKET week to override manually (Leave BLANK for automated next week forecast)'
        required: false
        type: string
      custom_market_date:
        description: 'Target DATE RANGE to override manually (Leave BLANK for automated next week forecast)'
        required: false
        type: string

jobs:
  execute-r3-matrix:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Active Repository Branch
      uses: actions/checkout@v3
      with:
        ref: ${{ github.ref }}
        persist-credentials: true

    - name: Initialize Python Core Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Deploy Script Dependencies
      working-directory: ./r3_almanac_agent
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Parameterized R3 Almanac Agent
      working-directory: ./r3_almanac_agent
      run: |
        set -euo pipefail
    
        # Manual values are used when provided.
        # Blank values allow the Python script to calculate the week automatically.
        python r3_almanac_agent.py \
          "${{ github.event.inputs.custom_market_week }}" \
          "${{ github.event.inputs.custom_market_date }}"

    - name: Verify R3 artifacts
      shell: bash
      run: |
        set -euo pipefail

        WEEK="${{ github.event.inputs.custom_market_week }}"

        if [ -z "$WEEK" ]; then
          WEEK="W$(date +%V)"
        fi

        for extension in json csv md; do
          file="outputs/R3/almanac_agent_${WEEK}.${extension}"

          if [ ! -s "$file" ]; then
            echo "Missing or empty R3 artifact: $file"
            exit 1
          fi
        done

        if grep -RniE '(^|[^a-z])(nan|null|n/a|infinity)([^a-z]|$)' \
          "outputs/R3/almanac_agent_${WEEK}."*; then
          echo "Invalid value detected in R3 outputs."
          exit 1
        fi

        echo "All R3 artifacts exist and passed verification."

    - name: Secure Ledger Artifacts & Route Commit to Active Branch
      run: |
        git config --global user.name "Team 2 Almanac Automation Bot"
        git config --global user.email "bot@team2.financial"
        
        # Capture all newly generated artifacts dynamically in the outputs folder
        git add outputs/R3/
        
        if git diff --staged --quiet; then
          echo "No strategic data shifts detected. Terminating smoothly."
        else
          git commit -m "chore(data): automated R3 next-week forecast execution matrix [skip ci]"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:${{ github.ref_name }}
        fi
